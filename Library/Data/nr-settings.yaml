---
queryLetter:
  sourceDraftUUID: "315D897D-FE86-465B-8DF0-BD624C21E9B3"
  sourceTag: "authoring/wfid/query"
  templateFile: "nr/query-letter.mustache"
  draftTags:
    - "authoring/wfid/query"
  # Select fields whose chosen value also tags the new draft, lowercased with
  # spaces as hyphens ("Query Manager" -> query-manager).
  tagFields:
    - queryType
  pickerData:
    name: agent
    label: Agent
  menuSettings:
    menuTitle: New Query Letter
    menuMessage: Choose an agent who has not been queried yet. Any other field below fills the matching {{tag}} in the template.
    isCancellable: true
    # Extra fields are optional. Each field name becomes a template tag,
    # e.g. a textField named "title" fills {{{title}}} in nr/query-letter.mustache.
    # Select choices fill their tag lowercased ("Literary fiction" -> literary fiction)
    # and also set "<name>_<choice>" for sections like {{#queryType_email}}
    # (spaces as underscores: "Query Manager" -> queryType_query_manager).
    menuItems:
      - type: select
        data:
          name: queryType
          label: Query Type
          values:
            - Email
            - Query Manager
          selectedValues:
            - Email
      - type: select
        data:
          name: genre
          label: Genre
          values:
            - Upmarket literary fiction
            - Literary fiction
          selectedValues:
            - Upmarket literary fiction
      - type: textField
        data:
          name: email
          label: Email Address
          # Shared with the fastmail prompt below.
          options: &emailAddressOptions
            keyboard: emailAddress
            autocapitalization: none
            autocorrect: false
      - type: button
        data:
          name: Create Letter
          value: create
          isDefault: true
fastmail:
  # Markdown, appended to every email body before the HTML conversion.
  # Single line breaks are kept. Leave empty for no signature.
  signature: |
    \---
    Nelson/Roberto
    Author/Filmmaker/Developer
    [nelsonroberto.com](https://nelsonroberto.com/)
  # Asked before the signature is appended. Skipped when signature is empty.
  signaturePrompt:
    menuTitle: Send to Fastmail
    menuMessage: Attach your signature?
  # Asks for the Subject: and Email: lines a draft is missing. Only the missing
  # fields are shown, and a field left blank creates the draft without it.
  missingFields:
    messages:
      subject: "No Subject: line found."
      recipient: "No Email: line found."
      both: "No Subject: or Email: line found."
    # Shown when a typed address cannot be read. [[address]] is what was typed.
    invalidAddress: '"[[address]]" is not a valid email address.'
    menuSettings:
      menuTitle: Send to Fastmail
      menuItems:
        - type: textField
          data:
            name: subject
            label: Subject
        - type: textField
          data:
            name: to
            label: To
        - type: textField
          data:
            name: email
            label: Email Address
            options: *emailAddressOptions
        - type: button
          data:
            name: Create Draft
            value: create
things:
  # The Morning Pages section Send To-do's to things sends and removes.
  todoHeading: "### To-Dos"
  # Offered by Insert Things Area, in this order. Spell each one exactly as
  # the area is named in Things.
  areas:
    - Sanity
    - Personal
    - Authoring
    - BVR Coaching
    - Cabin 23
    - Coto.Studio
  areaMenu:
    menuTitle: Things Area
    menuMessage: Which area should this go in?
  # Insert Things When. The time is used only when the reminder switch is on.
  whenMenu:
    menuTitle: Things When
    menuMessage: When should this start?
    menuItems:
      - type: datePicker
        data:
          name: when
          label: When
          options:
            mode: dateAndTime
      - type: switch
        data:
          name: reminder
          label: Create reminder
          initialValue: false
      - type: button
        data:
          name: Insert
          value: insert
          isDefault: true
  # Things Formatting Help, one prompt per page. Next moves on, Done stops.
  help:
    - menuTitle: "Things Format: To-dos"
      menuMessage: |
        A line starting with "- " is a to-do. Tags go after the title:

        - Call the dentist @when(today) @due(2026-11-01) @tags(home, errands) @area(Sanity)

        Under a to-do, indented "- " lines become checklist items and other indented lines become notes.

        @when: today, tomorrow, evening, anytime, someday, or a date
        @when(2026-11-01@14:15): a date with a reminder at that time
        @due: a date
        @area or @list: an area or project, spelled as in Things
        @tags: a comma list
        @done, @canceled: add it already finished

        Don't end a to-do with an @word Things doesn't use, like "Email @sam": it is read as a tag and dropped from the title.
    - menuTitle: "Things Format: Projects"
      menuMessage: |
        A line ending in ":" is a project. Indent its to-dos with a tab:

        Move house: @area(Personal) @due(2026-12-01)
            Notes about the move
            - Book movers
            Packing:
                - Kitchen
                - Books

        Inside a project, an indented line ending in ":" is a heading, and the to-dos under it are filed there.

        Projects take @area, @when, @due, and @tags.
    - menuTitle: "Things Format: Morning Pages"
      menuMessage: |
        In Morning Pages, everything under ### To-Dos goes to Things, and the section is removed before DayOne:

        - Buy milk @tags(errands) @when(today)
            Get the oat milk

        Write it like any Things Parser draft: to-dos, notes, checklist items, and projects all work. Add Note starts an indented note line.
    - menuTitle: "Things Format: Variables"
      menuMessage: |
        Things Parser asks for each {{variable}} before it runs:

        {{name}}: a text field
        {{date:due}}: a date picker
        {{date:due-1d}}: that date moved by days (d), weeks (w), or months (m)
        {{bool:#urgent}}...{{/urgent}}: a switch that shows or hides the text
        {{#items}}- {{.}}{{/items}}: one line per item in a comma list
