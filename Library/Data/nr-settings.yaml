---
queryLetter:
  sourceDraftUUID: "315D897D-FE86-465B-8DF0-BD624C21E9B3"
  sourceTag: "authoring/wfid/query"
  templateFile: "nr/query-letter.mustache"
  draftTags:
    - "authoring/wfid/query"
  # Flag color for new letters: orange, red, purple, blue, yellow, green, gray.
  flag: red
  # Select fields whose chosen value also tags the new draft, lowercased with
  # spaces as hyphens ("Query Manager" -> query-manager).
  tagFields:
    - queryType
  pickerData:
    name: agent
    label: Agent
  menuSettings:
    menuTitle: New Query Letter
    menuMessage: Choose an agent who has not been queried yet. Any other field below fills the matching {{tag}} in the template.
    isCancellable: true
    # Extra fields are optional. Each field name becomes a template tag,
    # e.g. a textField named "title" fills {{{title}}} in nr/query-letter.mustache.
    # Select choices fill their tag lowercased ("Literary fiction" -> literary fiction)
    # and also set "<name>_<choice>" for sections like {{#queryType_email}}
    # (spaces as underscores: "Query Manager" -> queryType_query_manager).
    menuItems:
      - type: select
        data:
          name: queryType
          label: Query Type
          values:
            - Email
            - Query Manager
          selectedValues:
            - Email
      - type: select
        data:
          name: genre
          label: Genre
          values:
            - Upmarket literary fiction
            - Literary fiction
          selectedValues:
            - Upmarket literary fiction
      - type: textField
        data:
          name: email
          label: Email Address
          # Shared with the fastmail prompt below.
          options: &emailAddressOptions
            keyboard: emailAddress
            autocapitalization: none
            autocorrect: false
      # Switches fill a true/false tag for {{#offerSample}}...{{/offerSample}} sections.
      - type: switch
        data:
          name: offerSample
          label: Offer to send a sample
          initialValue: false
      - type: button
        data:
          name: Create Letter
          value: create
          isDefault: true
fastmail:
  # Markdown, appended to every email body before the HTML conversion.
  # Single line breaks are kept. Leave empty for no signature.
  signature: &emailSignature |
    \---
    Nelson/Roberto
    Author/Filmmaker/Developer
    [nelsonroberto.com](https://nelsonroberto.com/)
  # Asked before the signature is appended. Skipped when signature is empty.
  signaturePrompt:
    menuTitle: Send to Fastmail
    menuMessage: Attach your signature?
  # Asks for the Subject: and Email: lines a draft is missing. Only the missing
  # fields are shown, and a field left blank creates the draft without it.
  missingFields:
    messages: &missingFieldMessages
      subject: "No Subject: line found."
      recipient: "No Email: line found."
      both: "No Subject: or Email: line found."
    # Shown when a typed address cannot be read. [[address]] is what was typed.
    invalidAddress: &invalidAddressMessage '"[[address]]" is not a valid email address.'
    menuSettings: &missingFieldsMenu
      menuTitle: Send to Fastmail
      menuItems:
        - type: textField
          data:
            name: subject
            label: Subject
        - type: textField
          data:
            name: to
            label: To
        - type: textField
          data:
            name: email
            label: Email Address
            options: *emailAddressOptions
        - type: button
          data:
            name: Create Draft
            value: create
# The same signature and prompts as Fastmail, under Gmail's own title.
gmail:
  # Asked after the draft is created. On a Mac, Yes opens draftsURL. The number
  # is the account's position among those signed in to the browser, from 0.
  # On iPhone and iPad it opens the Gmail app with draftsAppURL.
  openPrompt:
    menuTitle: Send to Gmail
    menuMessage: Open Gmail now?
  draftsURL: "https://mail.google.com/mail/u/0/#drafts"
  draftsAppURL: "googlegmail://"
  signature: *emailSignature
  signaturePrompt:
    menuTitle: Send to Gmail
    menuMessage: Attach your signature?
  missingFields:
    messages: *missingFieldMessages
    invalidAddress: *invalidAddressMessage
    menuSettings:
      <<: *missingFieldsMenu
      menuTitle: Send to Gmail
newEmail:
  templateFile: "nr/new-email.mustache"
  draftTags:
    - "email"
  messages:
    missingName: "Enter the person's name."
    # Shown when a typed address cannot be read. [[address]] is what was typed.
    invalidAddress: '"[[address]]" is not a valid email address.'
  menuSettings:
    menuTitle: New Email
    menuMessage: Who is this email to?
    menuItems:
      - type: textField
        data:
          name: name
          label: Name
      - type: textField
        data:
          name: email
          label: Email Address
          options: *emailAddressOptions
      - type: button
        data:
          name: Create
          value: create
things:
  # The Morning Pages section Send To-do's to things sends and removes.
  todoHeading: "### To-Dos"
  # Offered by Insert Things Area, in this order. Spell each one exactly as
  # the area is named in Things.
  areas:
    - Sanity
    - Personal
    - Authoring
    - BVR Coaching
    - Cabin 23
    - Coto.Studio
  areaMenu:
    menuTitle: Things Area
    menuMessage: Which area should this go in?
  # Offered by Insert Things Tags, in this order. Spell each one exactly as
  # the tag is named in Things. Seeded 2026-11-15 from the ten tags used most
  # in the past year, plus Writing.
  tags:
    - Chore
    - Moderate
    - Easy
    - Programming
    - Writing
    - Stone
    - Challenge
    - Online
    - Errand
    - Email
    - Adulting
  tagMenu:
    menuTitle: Things Tags
    menuMessage: Which tags should this have?
  # Insert Things Project runs this shortcut, which outputs the open projects
  # as {"projects": [{"title": "...", "id": "..."}, ...]}.
  projectsShortcut: Get Things Projects
  projectMenu:
    menuTitle: Things Project
    menuMessage: Which project should this go in?
  # Insert Things Date. Create when types @when (start date), Create due types
  # @due (deadline). The time is used only for @when with the reminder on,
  # since Things deadlines have no time.
  dateMenu:
    menuTitle: Things Date
    menuMessage: Pick a start date (when) or a deadline (due).
    menuItems:
      - type: datePicker
        data:
          name: date
          label: Date
          options:
            mode: dateAndTime
      - type: switch
        data:
          name: reminder
          label: Create reminder (when only)
          initialValue: false
      - type: button
        data:
          name: Create when
          value: when
          isDefault: true
      - type: button
        data:
          name: Create due
          value: due
  # Things Formatting Help, one prompt per page. Next moves on, Done stops.
  help:
    - menuTitle: "Things Format: To-dos"
      menuMessage: |
        A line starting with "- " is a to-do. Tags go after the title:

        - Call the dentist @when(today) @due(2026-11-01) @tags(home, errands) @area(Sanity)

        Under a to-do, indented "- " lines become checklist items and other indented lines become notes.

        @when: today, tomorrow, evening, anytime, someday, or a date
        @when(2026-11-01@14:15): a date with a reminder at that time
        @due: a date
        @area or @list: an area or project, spelled as in Things
        @project: a project, picked from Things with Insert Things Project
        @tags: a comma list, or picked with Insert Things Tags
        @done, @canceled: add it already finished

        Don't end a to-do with an @word Things doesn't use, like "Email @sam": it is read as a tag and dropped from the title.
    - menuTitle: "Things Format: Projects"
      menuMessage: |
        A line ending in ":" is a project. Indent its to-dos with a tab:

        Move house: @area(Personal) @due(2026-12-01)
            Notes about the move
            - Book movers
            Packing:
                - Kitchen
                - Books

        Inside a project, an indented line ending in ":" is a heading, and the to-dos under it are filed there.

        Projects take @area, @when, @due, and @tags.
    - menuTitle: "Things Format: Morning Pages"
      menuMessage: |
        In Morning Pages, everything under ### To-Dos goes to Things, and the section is removed before DayOne:

        - Buy milk @tags(errands) @when(today)
            Get the oat milk

        Write it like any Things Parser draft: to-dos, notes, checklist items, and projects all work. Add Note starts an indented note line.
    - menuTitle: "Things Format: Variables"
      menuMessage: |
        Things Parser asks for each {{variable}} before it runs:

        {{name}}: a text field
        {{date:due}}: a date picker
        {{date:due-1d}}: that date moved by days (d), weeks (w), or months (m)
        {{bool:#urgent}}...{{/urgent}}: a switch that shows or hides the text
        {{#items}}- {{.}}{{/items}}: one line per item in a comma list
# Kutt link shortener (shared/libraries/kutt.js). The Kutt domain and API key
# are asked for once and kept in Drafts' Credentials, not here.
kutt:
  # Shorten Link runs a full sync first when the last one is older than this.
  syncAfterDays: 7
  # Shorten Link: the field starts with the clipboard when it holds a link.
  shortenPrompt:
    menuTitle: Shorten Link
    menuMessage: The short link is inserted at the cursor and copied.
    menuItems:
      - type: textField
        data:
          name: url
          label: Link
          options:
            keyboard: url
            autocapitalization: none
            autocorrect: false
            wantsFocus: true
      # Sent to Kutt only when a new link is made; an existing link keeps its
      # own. Shown as the title in Find Short Link.
      - type: textField
        data:
          name: description
          label: Description
          options:
            placeholder: Optional, e.g. the post title
      # The domain a new short link is made on; a page already shortened gets
      # its existing link. A picker (pop-up menu on Mac), filled with Kutt's
      # default domain and the custom domains from the last Sync Kutt Links.
      # Left out when there is only one.
      - type: picker
        data:
          name: domain
          label: Domain
      - type: button
        data:
          name: Shorten
          value: shorten
          isDefault: true
  # Find Short Link: the saved links in a page that filters as you type.
  # The template is under Library/Templates/.
  findLink:
    template: nr/kutt-find-link.html
  # Edit Short Link: pick a link on the Find Short Link page, then change it.
  # Field names match Kutt's (target, address, description). Only changed
  # fields are sent; Kutt ignores a blank one, so a description can be
  # changed but not removed. [[link]] is the short link being edited.
  editPrompt:
    menuTitle: Edit Short Link
    menuMessage: "[[link]]"
    menuItems:
      - type: textField
        data:
          name: target
          label: Page URL
          options:
            keyboard: url
            autocapitalization: none
            autocorrect: false
      - type: textField
        data:
          name: address
          label: Short address
          options:
            autocapitalization: none
            autocorrect: false
      - type: textField
        data:
          name: description
          label: Description
      - type: button
        data:
          name: Save
          value: save
          isDefault: true
      - type: button
        data:
          name: Delete
          value: delete
  # Asked before Delete. [[link]] is the short link.
  deleteConfirm:
    menuTitle: Delete Short Link?
    menuMessage: "[[link]] will stop working. This cannot be undone."
  # [[url]], [[link]] and [[count]] are filled in when shown.
  messages:
    invalidURL: '"[[url]]" is not a link.'
    alreadyShort: "[[url]] is already a short link."
    shortened: "Copied [[link]]"
    synced: "Synced [[count]] links from Kutt."
    noLinks: "No saved links yet. Run Sync Kutt Links first."
    updated: "Updated [[link]]"
    noChanges: "Nothing changed."
    deleted: "Deleted [[link]]"
# The weekly lunch menu draft, shared by Lunch Reminders and What's for Lunch.
# The open draft is used when it has menuTag. Otherwise menuDraftUUID when
# set, otherwise the newest draft with the tag (a new one comes each week).
lunchMenu: &lunchMenu
  menuTag: "bvr/menu"
  menuDraftUUID: ""
# Lunch Reminders: a Things to-do for each school day picked from the week's
# lunch menu, scheduled for that day with a reminder at reminderTime. The
# day's menu goes in the notes.
lunchReminders:
  <<: *lunchMenu
  taskTitle: Pack containers to bring home food
  # The Things area the to-dos go in, spelled as in Things. Leave empty for
  # the Inbox.
  area: Sanity
  # 24-hour time. Days whose reminder time has passed are not offered.
  reminderTime: "11:00"
  dayMenu:
    menuTitle: Lunch Reminders
    menuMessage: Which days should get a reminder?
  messages:
    noMenu: "No lunch menu draft found."
    noDays: "No school days with lunch left on this menu."
    thingsFailed: "Things did not add the reminders."
    # [[count]] is how many to-dos were added.
    added: "Added [[count]] lunch reminders to Things."
# What's for Lunch: today's menu in a dialog. On a weekend, or a weekday the
# menu does not cover, it opens the newest menu instead. The dialog's title
# is "<Weekday>'s Lunch".
whatsForLunch:
  <<: *lunchMenu
  dialog:
    isCancellable: false
    menuItems:
      - type: button
        data:
          name: OK
          value: ok
          isDefault: true
      - type: button
        data:
          name: Open Menu
          value: open
  messages:
    noMenu: "No lunch menu draft found."
    noLunch: "No lunch on the menu today."
