---
displayMsgs:
  messageSuccess:
  submitSuccess: Attendance has been submitted!
  submitFailure: Attendance could not be submitted!
  alreadySubmitted: Addendace has already been submitted today.
  noOneAbsent: No one is absent today!
getTeamIDFromPrompt:
  # Lists only the teams in season unless none are (then every team) or the
  # action is Start New Season. One team in season is used without asking.
  noneActiveMessage: No team is in season. Which team would you like to use?
  menuSettings:
    menuTitle: Select Team
    menuMessage: Which team would you like to use?
    isCancellable: false
    menuItems: []
attendaceIsReady:
  menuSettings:
    menuTitle: Submit Attendenace?
    menuMessage: Attenhance has not been marked as taken. Submit it anyway?
    menuItems:
      - type: button
        data:
          name: Yes
          value: yes
      - type: button
        data:
          name: No
          value: no
recordScore:
  pickerData:
    name: score
    label: Game Score
  menuSettings:
    menuTitle: What was the score?
    menuMessage: "Remember: Your team score is always first!"
    menuItems:
      - type: button
        data:
          name: Go
          value: go
recordDate:
  menuSettings:
    menuTitle: Day of Game
    menuMessage: When was the game played?
    menuItems:
      - type: button
        data:
          name: Today
          value: today
      - type: button
        data:
          name: Another Day
          value: other
getDateFromPrompt:
  menuSettings:
    menuTitle: Day of Game
    menuMessage: Please select the date of the game
    menuItems:
      - type: datePicker
        data:
          name: date
          label: Date
          options:
            mode: date
      - type: button
        data:
          name: Ok
          value: ok
startNewSeason:
  seasonIDField:
    type: textField
    data:
      name: seasonID
      label: Season
  startDateField:
    type: datePicker
    data:
      name: startDate
      label: First Day
      options:
        mode: date
  menuSettings:
    menuTitle: Start New Season
    menuMessage: "Name the season and pick its first day. Any name works, such as 2026-winter for a winter sport."
    menuItems:
      - type: button
        data:
          name: Start Season
          value: start
editSeason:
  labelField:
    type: textField
    data:
      name: label
      label: Name
  startDateField:
    type: datePicker
    data:
      name: startDate
      label: First Day
      options:
        mode: date
  hasEndDateField:
    type: switch
    data:
      name: hasEndDate
      label: Has a last day
  endDateField:
    type: datePicker
    data:
      name: endDate
      label: Last Day
      options:
        mode: date
  formField:
    type: textField
    data:
      options:
        placeholder: https://docs.google.com/forms/...
        keyboard: url
        autocorrect: false
        autocapitalization: none
  attendanceField:
    type: textField
    data:
      name: attendance
      label: Attendance messages to
      options:
        autocorrect: false
        autocapitalization: allCharacters
  gameReportField:
    type: textField
    data:
      name: gameReport
      label: Score messages to
      options:
        autocorrect: false
        autocapitalization: allCharacters
  rosterLabel:
    type: label
    data:
      name: roster
      options:
        textSize: body
  newRosterField:
    type: switch
    data:
      name: newRoster
      label: Start a new roster draft
  menuSettings:
    menuTitle: Edit Season
    menuMessage: "Change this season's name, dates, or form links. The last day is saved only when the switch is on."
    menuItems:
      - type: button
        data:
          name: Save
          value: save
  startDateWarning:
    menuTitle: Change the first day?
    menuMessage: "Practice plan weeks are counted from the first day. Plans already made keep their week numbers (W1, W2, ...), so new plans may not line up with old ones. Change it anyway?"
  clearLinksPrompt:
    menuTitle: Clear form links?
    menuMessage: "These form links were left blank. Clear the saved links?"
recipientsPrompt:
  attendanceField:
    type: textField
    data:
      name: attendance
      label: Attendance messages to
      options:
        autocorrect: false
        autocapitalization: allCharacters
  gameReportField:
    type: textField
    data:
      name: gameReport
      label: Score messages to
      options:
        autocorrect: false
        autocapitalization: allCharacters
  menuSettings:
    menuTitle: Who Gets Messages
    menuMessage: "Initials from staff.yaml.tpl, separated by commas. Leave them as they are to keep the team's usual lists."
    menuItems:
      - type: button
        data:
          name: Save
          value: save
attendanceDraftPrompt:
  menuSettings:
    menuTitle: Roster Draft
    menuMessage: "Keep the current roster draft, or start a new one?"
    menuItems:
      - type: button
        data:
          name: Keep
          value: keep
          isDefault: true
      - type: button
        data:
          name: Start a New One
          value: new
formURLPrompt:
  urlField:
    type: textField
    data:
      name: url
      label: Form link
      options:
        placeholder: https://docs.google.com/forms/...
        keyboard: url
        autocorrect: false
        autocapitalization: none
  menuSettings:
    menuTitle: Score Report Form
    menuMessage: "Paste this season's link to the form, from the athletic department's email. Leave it blank to skip."
    menuItems:
      - type: button
        data:
          name: Save
          value: save
recordOpponent:
  textField:
    type: textField
    data:
      name: opponent
      label: Opponent
  menuSettings:
    menuTitle: Name of Opponent
    menuMessage: Please enter who you played
    menuItems:
      - type: button
        data:
          name: Ok
          value: ok
getLocationFromPrompt:
  menuSettings:
    menuTitle: Location of Game
    menuMessage: Please where you played
    isCancellable: false
    menuItems:
      - type: button
        data:
          name: Home
          value: Home
      - type: button
        data:
          name: Away
          value: Away
notePrompt:
  tempMessage: What would you like to do with this note?
  menuSettings:
    menuTitle: Pick Action
    menuItems:
      - type: button
        data:
          name: Archive
          value: archive
      - type: button
        data:
          name: Leave in Place
          value: leave
insertPlayerName:
  pickerData:
    name: playerName
    label: Players
  menuSettings:
    menuTitle: Choose Player
    menuMessage: Pick name of player you wish to insert
    isCancellable: true
    menuItems:
      - type: button
        data:
          name: ok
          value: ok
submitGoogleForm:
  menuSettings:
    menuTitle: Google Form Submitted
    menuMessage: Has google form has been submitted?
    menuItems:
      - type: button
        data:
          name: Yes
          value: yes
      - type: button
        data:
          name: No
          value: no
updateRoster:
  menuSettings:
    menuTitle: Please Verify
    menuMessage: Would you like to update the roster with this content?
    menuItems:
      - type: button
        data:
          name: "Yes"
          value: "yes"
      - type: button
        data:
          name: "No"
          value: "no"
