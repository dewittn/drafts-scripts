---
# School-wide score report forms. The athletic department copies each form
# every year, so the entry IDs stay put and only the URL changes. The URL is
# per season, in the team file (teams/<id>.json, formURLs), asked for the
# first time a report is submitted. postData true submits directly; false
# opens the prefilled form to review and send.
ms-score-report:
  title: MS score report
  postData: true
  fields:
    - key: teamName
      title: Team
      entryID: 2066576502
    - key: googleFormDate
      title: Date of Contest
      entryID: 2108682401
    - key: opponent
      title: Opponent
      entryID: 1269407546
    - key: location
      title: Location
      entryID: 542234752
    - key: result
      title: Result
      entryID: 936144083
      options:
        - Win
        - Loss
        - Draw
    - key: scoreUs
      title: BVR
      entryID: 1101471948
    - key: scoreThem
      title: Them
      entryID: 1320101693
    - key: highlights
      title: Highlights?
      message: Check for grammar and spelling. Please include some statistical info if possible
      entryID: 211909310
varsity-score-report:
  title: Varsity score report
  postData: false
  fields:
    - key: teamName
      title: Team
      entryID: 1633228220
    - key: hcName
      title: Your Name
      entryID: 1506871634
    - key: googleFormDate
      title: Date of Contest
      entryID: 1355820554
    - key: opponent
      title: Opponent
      entryID: 1263048397
    - key: result
      title: Result
      entryID: 702349070
      options:
        - Win
        - Loss
        - Draw
    - key: fullScore
      title: Score
      entryID: 2100816744
    - key: highlights
      title: Highlights?
      message: Check for grammar and spelling. Please include some statistical info if possible
      entryID: 1620020605
    - key: reported
      title: Report the score?
      message: "Did you report the score to the Boston Globe (617-929-3235) and Boston Herald: hssports@bostonherald.com"
      entryID: 999954584
      options:
        - "Yes"
        - "Not applicable (non-varsity team)"
    - key: comments
      title: Other/Comments
      message: (Any notes about refs, buses, etc)
      entryID: 544469491
