---
# School-wide score report and attendance forms. The athletic department copies each form
# every year, so the entry IDs stay put and only the URL changes. The URL is
# per season, in the team file (teams/<id>.json, formURLs), asked for the
# first time a report is submitted. postData true submits directly; false
# opens the prefilled form to review and send.
ms-score-report:
  title: MS score report
  postData: true
  fields:
    - key: teamName
      title: "Select your team:"
      entryID: 2066576502
    - key: googleFormDate
      title: Date of Contest
      entryID: 2108682401
    - key: opponent
      title: Opponent
      entryID: 1269407546
    - key: location
      title: Location
      entryID: 542234752
    - key: result
      title: Result
      entryID: 936144083
      options:
        - Win
        - Loss
        - Draw
    - key: scoreUs
      title: BVR
      entryID: 1101471948
    - key: scoreThem
      title: Them
      entryID: 1320101693
    - key: highlights
      title: Highlights?
      message: Check for grammar and spelling. Please include some statistical info if possible
      entryID: 211909310
varsity-score-report:
  title: Varsity score report
  postData: false
  fields:
    - key: teamName
      title: Team
      entryID: 1633228220
    - key: hcName
      title: Your Name
      entryID: 1506871634
    - key: googleFormDate
      title: Date of Contest
      entryID: 1355820554
    - key: opponent
      title: Opponent
      entryID: 1263048397
    - key: result
      title: Result
      entryID: 702349070
      options:
        - Win
        - Loss
        - Draw
    - key: fullScore
      title: Score
      entryID: 2100816744
    - key: highlights
      title: Highlights?
      message: Check for grammar and spelling. Please include some statistical info if possible
      entryID: 1620020605
    - key: reported
      title: Report the score?
      message: "Did you report the score to the Boston Globe (617-929-3235) and Boston Herald: hssports@bostonherald.com"
      entryID: 999954584
      options:
        - "Yes"
        - "Not applicable (non-varsity team)"
    - key: comments
      title: Other/Comments
      message: (Any notes about refs, buses, etc)
      entryID: 544469491
# Upper school attendance, filled in by Record Attendance and opened to
# review and submit by hand (postData false; Attendance never posts it). The
# link is per term, like the score forms, and asked for the first time
# attendance is recorded in a term. Three pages, no branching. Entry IDs were
# scraped from the winter form on 2026-11-07; check them again on the spring
# form. Page 2 ("Which Fall Team(s)" entry 1059059554 and "Spring Teams"
# entry 818161226, checkboxes, not required) is left blank.
us-attendance:
  title: US attendance
  postData: false
  fields:
    # Page 1
    - key: hcName
      title: "Name:"
      entryID: 59639440
    - key: teamName
      title: "Select your team:"
      message: A dropdown of the term's teams; the value is attendance.formTeam in teams.yaml
      entryID: 151743401
    # Page 3
    - key: allPresent
      title: "All athletes are present :)"
      entryID: 307654852
      options:
        - Yes, all the athletes are present
    - key: excused
      title: Please list any excused absences
      entryID: 1275473467
    - key: unexcused
      title: Please list any unexcused absences
      entryID: 1652526151
